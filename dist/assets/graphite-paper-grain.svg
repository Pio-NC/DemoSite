<svg xmlns="http://www.w3.org/2000/svg" width="240" height="240" viewBox="0 0 240 240">
  <title>Fine graphite paper grain</title>
  <defs>
    <filter id="paper-grain" x="0" y="0" width="100%" height="100%" color-interpolation-filters="sRGB">
      <feTurbulence type="fractalNoise" baseFrequency="0.79" numOctaves="3" seed="23" stitchTiles="stitch" result="noise"/>
      <feColorMatrix in="noise" type="saturate" values="0" result="mono"/>
      <feComponentTransfer in="mono">
        <feFuncR type="linear" slope="1.35" intercept="-0.175"/>
        <feFuncG type="linear" slope="1.35" intercept="-0.175"/>
        <feFuncB type="linear" slope="1.35" intercept="-0.175"/>
        <feFuncA type="table" tableValues="1 1"/>
      </feComponentTransfer>
    </filter>
  </defs>
  <rect width="240" height="240" fill="#808080" filter="url(#paper-grain)"/>
</svg>
